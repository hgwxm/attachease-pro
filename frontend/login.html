<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - AttachEase Pro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <!-- 左侧品牌展示区 -->
    <div class="login-brand">
      <div class="login-brand-content">
        <div class="login-brand-logo">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          AttachEase Pro
        </div>
        <h1 class="login-brand-title">二手好物<br>担保交易</h1>
        <p class="login-brand-desc">校园二手交易平台，让闲置物品流转起来，安全可靠，轻松买卖</p>
        <div class="login-brand-features">
          <div class="login-feature">
            <span class="login-feature-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            担保交易，资金安全放心
          </div>
          <div class="login-feature">
            <span class="login-feature-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            实名认证，信用有保障
          </div>
          <div class="login-feature">
            <span class="login-feature-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            校园同城，快速面交交接
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧表单区 -->
    <div class="login-form-side">
      <div class="login-box">
        <!-- 移动端 Logo -->
        <div class="login-logo-mobile">
          <div class="login-title">📦 AttachEase Pro</div>
          <div class="login-subtitle">二手好物 · 担保交易</div>
        </div>

        <div class="login-header">
          <h2 id="formTitle">欢迎回来</h2>
          <p id="formDesc">登录账号，开始淘好物</p>
        </div>

        <div class="login-tabs">
          <div class="login-tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
          <div class="login-tab" id="tabRegister" onclick="switchTab('register')">注册</div>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" onsubmit="return doLogin(event)">
          <div class="login-input-wrap">
            <svg class="login-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <input class="login-input" id="loginPhone" placeholder="手机号" maxlength="11" type="tel">
          </div>
          <div class="login-input-wrap">
            <svg class="login-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="login-input" id="loginPassword" type="password" placeholder="密码">
          </div>
          <button class="login-btn" type="submit">登 录</button>
          <div class="login-tip">
            <div class="login-tip-title">💡 测试账号</div>
            用户 13800138000 / 123456<br>
            用户 13800000001 / 123456<br>
            管理员 13900139000 / admin123
          </div>
        </form>

        <!-- 注册表单 -->
        <form id="registerForm" onsubmit="return doRegister(event)" class="hidden">
          <div class="login-input-wrap">
            <svg class="login-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <input class="login-input" id="regPhone" placeholder="手机号" maxlength="11" type="tel">
          </div>
          <div class="login-input-wrap">
            <svg class="login-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="login-input" id="regName" placeholder="昵称（选填）">
          </div>
          <div class="login-input-wrap">
            <svg class="login-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="login-input" id="regPassword" type="password" placeholder="设置密码">
          </div>
          <button class="login-btn" type="submit">注 册</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    // 已登录直接跳首页
    if (auth.getToken()) location.href = 'index.html';

    function switchTab(tab) {
      const isLogin = tab === 'login';
      $('#tabLogin').classList.toggle('active', isLogin);
      $('#tabRegister').classList.toggle('active', !isLogin);
      $('#loginForm').classList.toggle('hidden', !isLogin);
      $('#registerForm').classList.toggle('hidden', isLogin);
      $('#formTitle').textContent = isLogin ? '欢迎回来' : '创建账号';
      $('#formDesc').textContent = isLogin ? '登录账号，开始淘好物' : '注册新账号，加入平台';
    }

    async function doLogin(e) {
      e.preventDefault();
      const phone = $('#loginPhone').value.trim();
      const password = $('#loginPassword').value;
      if (!phone || !password) return toast('请填写手机号和密码', 'error');
      try {
        const { token, user } = await API.login(phone, password);
        auth.setAuth(token, user);
        toast('登录成功', 'success');
        setTimeout(() => location.href = 'index.html', 600);
      } catch (err) {
        toast(err.message, 'error');
      }
      return false;
    }

    async function doRegister(e) {
      e.preventDefault();
      const phone = $('#regPhone').value.trim();
      const password = $('#regPassword').value;
      const name = $('#regName').value.trim();
      if (!phone || !password) return toast('请填写手机号和密码', 'error');
      try {
        const { token, user } = await API.register(phone, password, name);
        auth.setAuth(token, user);
        toast('注册成功', 'success');
        setTimeout(() => location.href = 'index.html', 600);
      } catch (err) {
        toast(err.message, 'error');
      }
      return false;
    }
  </script>
</body>
</html>
